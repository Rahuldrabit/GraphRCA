[project]
name = "graphrca"
version = "0.1.0"
description = "LangGraph-based Autonomous SRE Pipeline with STRATUS NeurIPS pillars"
authors = [
    { name = "Rahul", email = "rahul@example.com" },
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0,<0.4",
    "python-dotenv>=1.0",
    "networkx>=3.3",
    "numpy==1.26.4",
    "openai>=1.33.0",
    "neo4j>=5.22.0",
    "scipy>=1.11.0",
]

[project.scripts]
graphrca = "GraphRCA_agent.run_pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["AIOpsLab", ".venv", "venv", "GraphRCA_output", "eval", "__pycache__"]
